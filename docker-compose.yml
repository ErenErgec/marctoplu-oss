# Yerel geliştirme ortamı. Değerler kök dizindeki .env dosyasından okunur (bkz. .env.example).
# .env yoksa varsayılanlar kullanılır; kendi Firebase projenizle çalışmak için .env oluşturun.
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # NEXT_PUBLIC_* değerleri Next.js build'ine gömülür; çalışma zamanı environment'ı yetmez.
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-YOUR_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-marctoplu.firebaseapp.com}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-marctoplu}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-marctoplu.firebasestorage.app}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-720742633366}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-1:720742633366:web:0f21b2c188157d2fe517b7}
        - NEXT_PUBLIC_APP_STORE_URL=${NEXT_PUBLIC_APP_STORE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/MarcToken.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/serviceAccountKey.json
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=marctoken;Username=postgres;Password=postgres
      - App__FrontendUrl=http://localhost:3000
      - App__PythonExecutable=python3
      - App__AdminEmails=${ADMIN_EMAILS:-}
      - Firebase__ProjectId=${FIREBASE_PROJECT_ID:-marctoplu}
    depends_on:
      - postgres
    volumes:
      - ./secrets:/app/secrets

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=marctoken
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
